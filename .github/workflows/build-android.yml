name: Build NetShaper Android (.aar + Universal & Split APKs)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Go 1.26.x matches go.mod requirements of golang.org/x/crypto/x509roots/fallback & golang.org/x/mobile@latest.
      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Configure Preinstalled Android SDK & Install Platform 35, Build-Tools 35.0.0 & NDK 26.3
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          NDK_DIR="$SDK_ROOT/ndk/26.3.11579264"
          test -d "$NDK_DIR"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_DIR"
          } >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Gate 1 — Verify Untouched Windows v7.0 Zero-Regression
        run: python3 verify_static.py

      - name: Gate 2 — Verify & Race-Test Pure-Go mobilecore (MT-01..MT-18)
        working-directory: mobilecore
        run: |
          python3 verify_mobile_parity.py
          go mod tidy
          go vet ./...
          go test -race -v -count=1 ./...

      - name: Gate 3 — Verify Cross-Boundary Android Static Parity
        run: python3 android/verify_android_parity.py

      - name: Gate 4 — Build 16KB-Aligned Multi-ABI netshaper-core.aar (arm64, arm, amd64)
        working-directory: mobilecore
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          go get golang.org/x/mobile/bind
          mkdir -p ../android/app/libs
          gomobile bind -v \
            -target=android/arm64,android/arm,android/amd64 \
            -androidapi=26 \
            -ldflags="-s -w" \
            -o ../android/app/libs/netshaper-core.aar \
            .

      - name: Gate 5 — Verify 16KB ELF Page Alignment (0x4000) in libgojni.so
        run: |
          set -euo pipefail
          tmp_so_dir=$(mktemp -d)
          for abi in arm64-v8a x86_64; do
            unzip -p android/app/libs/netshaper-core.aar "jni/$abi/libgojni.so" > "$tmp_so_dir/libgojni_$abi.so"
            echo "=== ELF alignment check for $abi ==="
            readelf -lW "$tmp_so_dir/libgojni_$abi.so" | grep LOAD
            readelf -lW "$tmp_so_dir/libgojni_$abi.so" | grep LOAD | grep -Eq "0x4000|0x10000"
          done
          rm -rf "$tmp_so_dir"

      - name: Decode Optional Publisher Release Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "keystore_path=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
            echo "Publisher JKS Release keystore decoded successfully."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not configured — Release APKs will use debug signing (test builds only; may trigger Play Protect / Samsung AV)."
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle 8.9 (No Repo gradlew Required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gate 6 — Build Release & Debug APKs (Universal + ABI Splits)
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p dist-checksums
          find android/app/libs android/app/build/outputs/apk -type f \( -name "*.aar" -o -name "*.apk" \) -print0 | xargs -0 sha256sum > dist-checksums/SHA256SUMS.txt
          cat dist-checksums/SHA256SUMS.txt

      - name: Upload Build Artifacts (.aar, APKs & SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: netshaper-android-artifacts
          path: |
            android/app/libs/netshaper-core.aar
            android/app/build/outputs/apk/**/*.apk
            dist-checksums/SHA256SUMS.txt
